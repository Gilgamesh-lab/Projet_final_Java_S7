spring.application.name=TpFilRouge

# Connexion à la base : valeurs par défaut pour un MariaDB local,
# remplacées par les variables d'environnement DB_URL, DB_USER et DB_PASSWORD si elles existent
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/Base_ALTN72}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Recrée les tables (schema.sql) et recharge les données de démonstration (data.sql) à chaque démarrage
spring.sql.init.mode=${DB_INIT_MODE:always}

# Permet aux formulaires d'envoyer PUT et DELETE grâce au champ caché _method
spring.mvc.hiddenmethod.filter.enabled=true

# Affiche le message des ResponseStatusException dans les pages d'erreur
spring.web.error.include-message=always
