<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Équipements par station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">
    <h1 class="h3 mb-4">Équipements par station</h1>

    <!--/* F2 : choix de la station */-->
    <form class="row g-2 mb-4" method="get" th:action="@{equipement}" >
        <div class="col-auto">
            <label for="station" class="col-form-label">Station</label>
        </div>
        <div class="col-auto">
            <select id="station" name="station" class="form-select">
                <option selected>Gare Centrale</option>
                <option>Place du Marché</option>
                <option>Université</option>
                <option>Aéroport</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Afficher</button>
        </div>
    </form>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>
            <th>Référence</th>

            <th>Libellé</th>
            <th>Type</th>

            <th>État</th>
            <th>Station</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="equipement: ${equipements}">
            <td th:text="${equipement.id}" />
            <td th:text="${equipement.reference}" />
            <td th:text="${equipement.libelle}" />
            <td th:text="${equipement.type}" />
            <td th:text="${equipement.etat}" />
            <td th:text="${equipement.station.nom}" />
            <td>
                <form th:action="@{/equipements/{id}(id=${equipement.id})}" th:method="GET" style="display:inline;">
                    <button class="btn btn-info btn-sm">Détails</button>
                </form>

                <form th:action="@{/equipements/{id}(id=${equipement.id})}" th:method="DELETE" style="display:inline;">
                    <button class="btn btn-warning btn-sm">Supprimez</button>
                </form>
            </td>
            <br>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
