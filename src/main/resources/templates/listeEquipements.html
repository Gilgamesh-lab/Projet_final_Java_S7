<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Équipements par station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">
    <h1 class="h3 mb-4">Équipements par station</h1>

    <!--/* F2 : choix de la station */-->
    <form class="row g-2 mb-4" method="get">
        <div class="col-auto">
            <label for="station" class="col-form-label">Station</label>
        </div>
        <div class="col-auto">
            <select id="station" name="station" class="form-select">
                <option selected>Gare Centrale</option>
                <option>Place du Marché</option>
                <option>Université</option>
                <option>Aéroport</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Afficher</button>
        </div>
    </form>

    <h2 class="h5">Gare Centrale</h2>
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Référence</th>
            <th>Libellé</th>
            <th>Type</th>
            <th>État</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>ASC-001</td>
            <td>Ascenseur quai A</td>
            <td>Ascenseur</td>
            <td><span class="badge bg-danger">En panne</span></td>
            <td><a href="#" class="btn btn-sm btn-outline-primary">Voir la fiche</a></td>
        </tr>
        <tr>
            <td>ESC-001</td>
            <td>Escalator hall principal</td>
            <td>Escalier mécanique</td>
            <td><span class="badge bg-danger">En panne</span></td>
            <td><a href="#" class="btn btn-sm btn-outline-primary">Voir la fiche</a></td>
        </tr>
        <tr>
            <td>ECR-002</td>
            <td>Écran d'information hall</td>
            <td>Écran d'information</td>
            <td><span class="badge bg-success">En service</span></td>
            <td><a href="#" class="btn btn-sm btn-outline-primary">Voir la fiche</a></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
