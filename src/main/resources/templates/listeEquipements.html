<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Équipements par station</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<main class="container-xl contenu">
    <header class="entete-page">
        <div>
            <span class="surtitre">Réseau</span>
            <h1>Équipements par station</h1>
            <p>Retrouvez les équipements d'une station, leur type et leur état.</p>
        </div>
    </header>

    <!--/* F2 : choix de la station */-->
    <form class="panneau filtres" method="get" th:action="@{/equipements}">
        <div>
            <label for="station">Station</label>
            <select id="station" name="station" class="form-select">
                <option value="">Toutes les stations</option>
                <option th:each="nomStation : ${ {'Gare Centrale', 'Place du Marché', 'Université', 'Aéroport'} }"
                        th:value="${nomStation}"
                        th:text="${nomStation}"
                        th:selected="${param.station != null and param.station[0] == nomStation}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Afficher</button>
    </form>

    <div class="panneau panneau-table">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Référence</th>
                <th>Libellé</th>
                <th>Type</th>
                <th>État</th>
                <th>Station</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="equipement: ${equipements}">
                <td><a class="reference" th:href="@{/equipements/{id}(id=${equipement.id})}" th:text="${equipement.reference}">ASC-001</a></td>
                <td th:text="${equipement.libelle}">Ascenseur quai A</td>
                <td th:text="${equipement.type}">Ascenseur</td>
                <td>
                    <span class="pastille"
                          th:classappend="'etat-' + ${#strings.toLowerCase(equipement.etat.name())}"
                          th:text="${#strings.replace(equipement.etat.libelle, '_', ' ')}">En panne</span>
                </td>
                <td th:text="${equipement.station.nom}">Gare Centrale</td>
                <td>
                    <div class="actions">
                        <a th:href="@{/equipements/{id}(id=${equipement.id})}" class="btn btn-outline-secondary btn-sm">Détails</a>
                        <form th:if="${session.utilisateur?.responsable}"
                              th:action="@{/equipements/{id}(id=${equipement.id})}" th:method="DELETE"
                              onsubmit="return confirm('Supprimer cet équipement ?')">
                            <button class="btn btn-outline-danger btn-sm">Supprimer</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(equipements)}">
                <td colspan="6" class="vide">Aucun équipement pour cette station.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
