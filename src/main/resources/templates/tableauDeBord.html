<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">
    <h1 class="h3 mb-4">Tableau de bord des incidents actifs</h1>

    <!--/* F11 : indicateurs synthétiques */-->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <div class="fs-2 fw-bold"> [[${nbIncident}]]</div>
                    <div class="text-muted">Incidents actifs</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center border-danger">
                <div class="card-body">
                    <div class="fs-2 fw-bold text-danger">[[${nbIncidentRouge}]]</div>
                    <div class="text-muted">En rouge (≥ 72 h)</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center border-warning">
                <div class="card-body">
                    <div class="fs-2 fw-bold text-warning">[[${nbIncidentOrange}]]</div>
                    <div class="text-muted">En orange (48–72 h)</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center border-primary">
                <div class="card-body">
                    <div class="fs-2 fw-bold text-primary">[[${nbIncidentPrisEnCharge}]]</div>
                    <div class="text-muted">Pris en charge</div>
                </div>
            </div>
        </div>
    </div>

    <!--/* F11 : filtres (au moins deux critères) */-->
    <form class="row g-2 mb-3" method="get">
        <div class="col-md-4">
            <select name="station" class="form-select">
                <option value="">Toutes les stations</option>
                <option>Gare Centrale</option>
                <option>Place du Marché</option>
                <option>Université</option>
                <option>Aéroport</option>
            </select>
        </div>
        <div class="col-md-4">
            <select name="niveau" class="form-select">
                <option value="">Tous les niveaux</option>
                <option>Rouge</option>
                <option>Orange</option>
                <option>Vert</option>
                <option>Pris en charge</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Filtrer</button>
        </div>
    </form>

    <!--/* Indicateur calculé à partir de l'heure courante, jamais stocké en base (RG3, RG4) */-->
    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>
            <th>Niveau</th>

            <th>Ouvert depuis</th>
            <th>Station</th>

            <th>Équipement</th>
            <th>Description</th>

            <th>Identifiant</th>
            <th>Statut</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="incident: ${incidents}">
            <td th:text="${incident.id}" />
            <td th:text="${niveau[0]}" />

            <td th:text="${incident.getDateOuverture()}" />
            <td th:text="${incident.getEquipement().station.nom}" />

            <td th:text="${incident.getEquipement().libelle}" />
            <td th:text="${incident.description}" />

            <td th:text="${incident.identifiant}" />
            <td th:text="${incident.statut}" />


            <br>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
