<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statistiques</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<main class="container-xl contenu">
    <header class="entete-page">
        <div>
            <span class="surtitre">Supervision</span>
            <h1>Statistiques</h1>
            <p>Où se concentrent les incidents, et comment les prestataires sont évalués.</p>
        </div>
    </header>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Incidents actifs par station</div>
                <div class="card-body">
                    <canvas id="graphiqueStations" th:unless="${parStation.vide}" style="max-height: 320px;"></canvas>
                    <p class="secondaire mb-0" th:if="${parStation.vide}">Aucun incident actif.</p>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Incidents actifs par niveau d'attention</div>
                <div class="card-body">
                    <canvas id="graphiqueIndicateurs" style="max-height: 320px;"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card">
                <div class="card-header">Note moyenne des prestataires</div>
                <div class="card-body">
                    <canvas id="graphiqueNotes" th:unless="${notesPrestataires.vide}" style="max-height: 300px;"></canvas>
                    <p class="secondaire mb-0" th:if="${notesPrestataires.vide}">Aucune évaluation pour l'instant.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:inline="javascript">
    const parStation = {libelles: /*[[${parStation.libelles}]]*/ [], valeurs: /*[[${parStation.valeurs}]]*/ []};
    const parIndicateur = {libelles: /*[[${parIndicateur.libelles}]]*/ [], valeurs: /*[[${parIndicateur.valeurs}]]*/ []};
    const notes = {libelles: /*[[${notesPrestataires.libelles}]]*/ [], valeurs: /*[[${notesPrestataires.valeurs}]]*/ []};

    Chart.defaults.font.family = 'Barlow, system-ui, sans-serif';
    Chart.defaults.font.size = 14;
    Chart.defaults.color = '#5c6872';

    // Mêmes couleurs que les pastilles du tableau de bord : vert, orange, rouge, pris en charge
    const couleursIndicateurs = ['#177245', '#e07a14', '#c21f33', '#1553b6'];

    if (document.getElementById('graphiqueStations')) {
        new Chart(document.getElementById('graphiqueStations'), {
            type: 'bar',
            data: {labels: parStation.libelles, datasets: [{label: 'Incidents actifs', data: parStation.valeurs, backgroundColor: '#101e2c', borderRadius: 6, maxBarThickness: 64}]},
            options: {plugins: {legend: {display: false}}, scales: {x: {grid: {display: false}}, y: {beginAtZero: true, ticks: {precision: 0}, grid: {color: '#ecebe4'}}}}
        });
    }

    new Chart(document.getElementById('graphiqueIndicateurs'), {
        type: 'doughnut',
        data: {labels: parIndicateur.libelles, datasets: [{data: parIndicateur.valeurs, backgroundColor: couleursIndicateurs, borderWidth: 3, borderColor: '#fff'}]},
        options: {maintainAspectRatio: false, cutout: '62%', plugins: {legend: {position: 'bottom', labels: {usePointStyle: true, padding: 18}}}}
    });

    if (document.getElementById('graphiqueNotes')) {
        new Chart(document.getElementById('graphiqueNotes'), {
            type: 'bar',
            data: {labels: notes.libelles, datasets: [{label: 'Note moyenne / 5', data: notes.valeurs, backgroundColor: '#f5b700', borderRadius: 6, maxBarThickness: 36}]},
            options: {indexAxis: 'y', maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {min: 0, max: 5, grid: {color: '#ecebe4'}}, y: {grid: {display: false}}}}
        });
    }
</script>

</body>
</html>
