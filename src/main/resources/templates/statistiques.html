<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Statistiques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">
    <h1 class="h3 mb-4">Statistiques</h1>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Incidents actifs par station</div>
                <div class="card-body">
                    <canvas id="graphiqueStations" th:unless="${parStation.vide}"></canvas>
                    <p class="text-muted mb-0" th:if="${parStation.vide}">Aucun incident actif.</p>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Incidents actifs par niveau d'attention</div>
                <div class="card-body">
                    <canvas id="graphiqueIndicateurs" style="max-height: 320px;"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card">
                <div class="card-header">Note moyenne des prestataires</div>
                <div class="card-body">
                    <canvas id="graphiqueNotes" th:unless="${notesPrestataires.vide}" style="max-height: 300px;"></canvas>
                    <p class="text-muted mb-0" th:if="${notesPrestataires.vide}">Aucune évaluation pour l'instant.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const parStation = {libelles: /*[[${parStation.libelles}]]*/ [], valeurs: /*[[${parStation.valeurs}]]*/ []};
    const parIndicateur = {libelles: /*[[${parIndicateur.libelles}]]*/ [], valeurs: /*[[${parIndicateur.valeurs}]]*/ []};
    const notes = {libelles: /*[[${notesPrestataires.libelles}]]*/ [], valeurs: /*[[${notesPrestataires.valeurs}]]*/ []};

    // Mêmes couleurs que les badges du tableau de bord : vert, orange, rouge, pris en charge
    const couleursIndicateurs = ['#198754', '#fd7e14', '#dc3545', '#0d6efd'];

    if (document.getElementById('graphiqueStations')) {
        new Chart(document.getElementById('graphiqueStations'), {
            type: 'bar',
            data: {labels: parStation.libelles, datasets: [{label: 'Incidents actifs', data: parStation.valeurs, backgroundColor: '#6c757d'}]},
            options: {plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true, ticks: {precision: 0}}}}
        });
    }

    new Chart(document.getElementById('graphiqueIndicateurs'), {
        type: 'doughnut',
        data: {labels: parIndicateur.libelles, datasets: [{data: parIndicateur.valeurs, backgroundColor: couleursIndicateurs}]},
        options: {maintainAspectRatio: false}
    });

    if (document.getElementById('graphiqueNotes')) {
        new Chart(document.getElementById('graphiqueNotes'), {
            type: 'bar',
            data: {labels: notes.libelles, datasets: [{label: 'Note moyenne / 5', data: notes.valeurs, backgroundColor: '#ffc107'}]},
            options: {indexAxis: 'y', maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {min: 0, max: 5}}}
        });
    }
</script>

</body>
</html>
