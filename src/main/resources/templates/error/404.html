<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page introuvable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/entete :: entete}"></nav>

<div class="container">
    <div class="alert alert-warning">
        <h1 class="h4">Page introuvable (404)</h1>
        <!--/* Pour une URL inconnue, Spring renvoie un message technique : on le remplace */-->
        <p class="mb-0" th:text="${message != null and !#strings.startsWith(message, 'No static resource')} ? ${message} : 'La page demandée n\'existe pas.'">L'incident dont l'id est 999 n'existe pas</p>
    </div>
    <a class="btn btn-primary" th:href="@{/}">Retour à l'accueil</a>
</div>

</body>
</html>
