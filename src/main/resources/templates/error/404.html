<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page introuvable</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/entete :: entete}"></nav>

<main class="container page-erreur">
    <span class="code">404</span>
    <h1>Page introuvable</h1>
    <!--/* Pour une URL inconnue, Spring renvoie un message technique : on le remplace */-->
    <p th:text="${message != null and !#strings.startsWith(message, 'No static resource')} ? ${message} : 'La page demandée n\'existe pas.'">L'incident dont l'id est 999 n'existe pas</p>
    <a class="btn btn-primary" th:href="@{/}">Retour à l'accueil</a>
</main>

</body>
</html>
