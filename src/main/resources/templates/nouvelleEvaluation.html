<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Évaluer le prestataire</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<main class="container-xl contenu">
    <header class="entete-page">
        <div>
            <span class="surtitre" th:text="${incident.identifiant}">INC-010</span>
            <h1>Évaluer l'intervention</h1>
            <p th:text="${incident.description}">Marche bloquée sur l'escalator</p>
        </div>
    </header>

    <div class="panneau formulaire">
        <dl class="fiche mb-4">
            <dt>Prestataire</dt>
            <dd th:text="${incident.prestataire?.nom} ?: 'Aucun'">Ascenseurs Dupont</dd>
            <dt>Résolution</dt>
            <dd class="date" th:text="${incident.dateResolution != null} ? ${#temporals.format(incident.dateResolution, 'dd/MM/yyyy HH:mm')} : '—'">28/10/2026 10:00</dd>
        </dl>

        <div th:if="${erreur}" class="alert alert-danger" role="alert" th:text="${erreur}"></div>

        <form th:if="${evaluable}" th:action="@{/incidents/{id}/evaluation(id=${incident.id})}" method="post">
            <fieldset class="mb-4">
                <legend class="form-label">Note sur 5</legend>
                <div class="choix-note">
                    <th:block th:each="valeur : ${#numbers.sequence(1, 5)}">
                        <input type="radio" class="visually-hidden" name="note" th:id="'note' + ${valeur}" th:value="${valeur}"
                               th:checked="${note == valeur}" required>
                        <label th:for="'note' + ${valeur}" th:text="${valeur}">1</label>
                    </th:block>
                </div>
            </fieldset>

            <div>
                <label for="commentaire" class="form-label">Commentaire (facultatif)</label>
                <textarea id="commentaire" name="commentaire" rows="3" class="form-control" th:text="${commentaire}"></textarea>
            </div>

            <div class="pied-formulaire">
                <button type="submit" class="btn btn-signal">Enregistrer l'évaluation</button>
                <a th:href="@{/incidents/historique}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>

        <a th:unless="${evaluable}" th:href="@{/incidents/historique}" class="btn btn-outline-secondary">Retour à l'historique</a>
    </div>
</main>

</body>
</html>
