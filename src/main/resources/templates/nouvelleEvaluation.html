<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Évaluer le prestataire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container" style="max-width: 700px;">
    <h1 class="h3 mb-4">Évaluer l'intervention</h1>

    <div class="alert alert-light border mb-4">
        Incident <strong>INC-010</strong> — Marche bloquée sur l'escalator<br>
        Prestataire : <strong>Ascenseurs Dupont</strong> — résolu le 28/10/2026 à 10:00
    </div>

    <!--/* F10 : une seule évaluation par incident résolu et affecté, note de 1 à 5 (RG8) */-->
    <form method="post">
        <div class="mb-3">
            <label class="form-label d-block">Note</label>
            <div class="btn-group" role="group">
                <input type="radio" class="btn-check" name="note" id="note1" value="1">
                <label class="btn btn-outline-warning" for="note1">1</label>
                <input type="radio" class="btn-check" name="note" id="note2" value="2">
                <label class="btn btn-outline-warning" for="note2">2</label>
                <input type="radio" class="btn-check" name="note" id="note3" value="3">
                <label class="btn btn-outline-warning" for="note3">3</label>
                <input type="radio" class="btn-check" name="note" id="note4" value="4" checked>
                <label class="btn btn-outline-warning" for="note4">4</label>
                <input type="radio" class="btn-check" name="note" id="note5" value="5">
                <label class="btn btn-outline-warning" for="note5">5</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="commentaire" class="form-label">Commentaire (facultatif)</label>
            <textarea id="commentaire" name="commentaire" rows="3" class="form-control"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Enregistrer l'évaluation</button>
            <a href="#" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</div>

</body>
</html>
