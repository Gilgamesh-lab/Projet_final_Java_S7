<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Évaluer le prestataire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container" style="max-width: 700px;">
    <h1 class="h3 mb-4">Évaluer l'intervention</h1>

    <div class="alert alert-light border mb-4">
        Incident <strong th:text="${incident.identifiant}">INC-010</strong>
        — <span th:text="${incident.description}">Marche bloquée sur l'escalator</span><br>
        Prestataire : <strong th:text="${incident.prestataire?.nom} ?: 'aucun'">Ascenseurs Dupont</strong>
        <span th:if="${incident.dateResolution != null}"
              th:text="'— résolu le ' + ${#temporals.format(incident.dateResolution, 'dd/MM/yyyy à HH:mm')}">— résolu le 28/10/2026 à 10:00</span>
    </div>

    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <form th:if="${evaluable}" th:action="@{/incidents/{id}/evaluation(id=${incident.id})}" method="post">
        <div class="mb-3">
            <label class="form-label d-block">Note</label>
            <div class="btn-group" role="group">
                <th:block th:each="valeur : ${#numbers.sequence(1, 5)}">
                    <input type="radio" class="btn-check" name="note" th:id="'note' + ${valeur}" th:value="${valeur}"
                           th:checked="${note == valeur}" required>
                    <label class="btn btn-outline-warning" th:for="'note' + ${valeur}" th:text="${valeur}">1</label>
                </th:block>
            </div>
        </div>

        <div class="mb-3">
            <label for="commentaire" class="form-label">Commentaire (facultatif)</label>
            <textarea id="commentaire" name="commentaire" rows="3" class="form-control" th:text="${commentaire}"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Enregistrer l'évaluation</button>
            <a th:href="@{/incidents/historique}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>

    <a th:unless="${evaluable}" th:href="@{/incidents/historique}" class="btn btn-outline-secondary">Retour à l'historique</a>
</div>

</body>
</html>
