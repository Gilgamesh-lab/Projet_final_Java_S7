<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historique des incidents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">
    <h1 class="h3 mb-4">Historique des incidents résolus</h1>

    <!--/* F9 : du plus récent au plus ancien, par date de résolution (RG7) */-->
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>


            <th>Ouverture</th>
            <th>Station</th>

            <th>Équipement</th>
            <th>Description</th>

            <th>Identifiant</th>


            <th>Prestataire</th>
            <th>Note</th>
            <th></th>
        </tr>
        </thead>
        <a th:href="@{/incidents/exporter}" class="btn btn-secondary">Exporter en JSON</a>
        <tbody>
        <tr th:each="incident,iterator: ${incidents}">
            <td th:text="${incident.id}" />

            <td th:text="${incident.getDateOuverture()}" />
            <td th:text="${incident.getEquipement().station.nom}" />

            <td th:text="${incident.getEquipement().libelle}" />
            <td th:text="${incident.description}" />

            <td th:text="${incident.identifiant}" />


            <td th:text="${incident.prestataire.nom}" />
            <td>
                <span th:if="${incident.evaluation != null}" th:text="${incident.evaluation.note} + '/5'"></span>
                <a th:if="${incident.evaluation == null and incident.prestataire != null and session.utilisateur?.responsable}"
                   th:href="@{/incidents/{id}/evaluation(id=${incident.id})}" class="btn btn-sm btn-outline-success">Évaluer</a>
            </td>
            <td th:text="${incident.getEvaluation()?.getCommentaire()}" />


            <br>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
