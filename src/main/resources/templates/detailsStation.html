<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ALTN72 - TP Fil Rouge - Un station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>ALTN72 - TP Fil Rouge - Un station</h1>

    <!--/* 5.12.1 -- Formulaire dédié à la modification. Il est PRÉREMPLI :
           - th:object="${stationToUpdate}" rattache le formulaire à l'objet déposé dans le Model par le contrôleur (model.addAttribute("stationToUpdate", ...)) ;
           - th:field="*{nom}" lie le champ à l'attribut "nom" de cet objet : Thymeleaf génère les attributs id, name ET value (valeur actuelle).
             Le name généré ("nom", "prenom"...) est ce que @ModelAttribute utilise côté contrôleur pour reconstruire un Programmeur.
           Les noms des champs doivent donc être ceux des attributs de la classe Programmeur (langageExpertise, livrePrefere...), pas ceux des colonnes de la table. */-->

    <!--/* 5.10.2 / 5.12.2 -- 1re version : méthode POST + champ caché _method=PUT pour contourner la contrainte GET/POST des formulaires HTML
           (HiddenHttpMethodFilter, à activer dans application.properties).
           <form th:object="${stationToUpdate}" th:action="@{/stations/{idProgrammeur}(idProgrammeur=${stationToUpdate.id})}" method="POST">
           <input type="hidden" name="_method" value="PUT" />
           Ces instructions se simplifient avec "th:method" (ci-dessous) : Thymeleaf envoie un POST et ajoute lui-même le champ caché _method. */-->
    <form th:object="${stationToUpdate}" th:action="@{/stations/{idStation}(idStation=${stationToUpdate.id})}" th:method="PUT">

        <label class="form-label" for="id">ID</label>
        <input type="text" th:field="*{id}" class="form-control mb-3 w-50">

        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="identifiant">Identifiant</label>
        <input type="text" th:field="*{identifiant}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Validez</button>
    </form>

    <hr>
    <a th:href="@{/stations}">Afficher la liste des stations</a>
</div>
</body>
</html>
