<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Station [[${stationToUpdate.nom}]]</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<main class="container-xl contenu">
    <header class="entete-page">
        <div>
            <span class="surtitre" th:text="${stationToUpdate.identifiant}">STA-001</span>
            <h1 th:text="${stationToUpdate.nom}">Gare Centrale</h1>
            <p>Modifier les informations de la station.</p>
        </div>
    </header>

    <div class="panneau formulaire">
        <form th:object="${stationToUpdate}" th:action="@{/stations/{idStation}(idStation=${stationToUpdate.id})}" th:method="PUT">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label" for="nom">Nom</label>
                <input type="text" th:field="*{nom}" class="form-control" required>
            </div>

            <div>
                <label class="form-label" for="identifiant">Identifiant</label>
                <input type="text" th:field="*{identifiant}" class="form-control" required>
            </div>

            <div class="pied-formulaire">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/stations}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
