<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Création d'une nouvelle station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">
    <h1>Ajout d'un nouvelle stations</h1>

    <form th:action="@{/stations/creer}" th:object="${nouvelleStation}" method="POST">


        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="identifiant">Identifiant</label>
        <input type="text" th:field="*{identifiant}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Enregistrez</button>
    </form>

    <hr>
    <a th:href="@{/stations}">Afficher la liste des stations</a>
</div>
</body>
</html>
