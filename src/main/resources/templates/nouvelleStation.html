<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle station</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<main class="container-xl contenu">
    <header class="entete-page">
        <div>
            <span class="surtitre">Réseau</span>
            <h1>Nouvelle station</h1>
        </div>
    </header>

    <div class="panneau formulaire">
        <form th:action="@{/stations/creer}" th:object="${nouvelleStation}" method="POST">
            <div class="mb-3">
                <label class="form-label" for="nom">Nom</label>
                <input type="text" th:field="*{nom}" class="form-control" required>
            </div>

            <div>
                <label class="form-label" for="identifiant">Identifiant</label>
                <input type="text" th:field="*{identifiant}" class="form-control" placeholder="STA-005" required>
            </div>

            <div class="pied-formulaire">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/stations}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
