<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
</head>
<body class="page-connexion">

<section class="connexion-plan">
    <div>
        <h1>Le réseau,<br><em>en un coup d'œil.</em></h1>
        <p>Suivez les équipements, les incidents et leur prise en charge, station par station.</p>
    </div>

    <svg class="plan-reseau" viewBox="0 0 640 240" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 180H180L270 90H460L520 30H630" stroke="#f5b700" stroke-width="9"/>
        <path d="M60 30L170 140H410L500 210H630" stroke="#e8505f" stroke-width="9"/>
        <path d="M10 90H150L210 150V230" stroke="#4f8ff0" stroke-width="9"/>
        <g fill="#101e2c" stroke="#fff" stroke-width="5">
            <circle cx="85" cy="180" r="9"/>
            <circle cx="180" cy="180" r="9"/>
            <circle cx="270" cy="90" r="9"/>
            <circle cx="365" cy="90" r="9"/>
            <circle cx="520" cy="30" r="9"/>
            <circle cx="110" cy="80" r="9"/>
            <circle cx="170" cy="140" r="12"/>
            <circle cx="300" cy="140" r="9"/>
            <circle cx="410" cy="140" r="9"/>
            <circle cx="565" cy="210" r="9"/>
            <circle cx="60" cy="90" r="9"/>
            <circle cx="210" cy="205" r="9"/>
        </g>
    </svg>
</section>

<main class="connexion-formulaire">
    <div class="connexion-boite">
        <h2>Connexion</h2>
        <p>Accédez à votre espace de supervision.</p>

        <div th:if="${erreur}" class="alert alert-danger" role="alert" th:text="${erreur}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="login" class="form-label">Login</label>
                <input type="text" class="form-control" id="login" name="login"
                       th:value="${login}" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="motDePasse" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="motDePasse" name="motDePasse"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
    </div>
</main>

</body>
</html>
