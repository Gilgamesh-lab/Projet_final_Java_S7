<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des stations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">

    <h1>Liste des stations</h1>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">id</th>
            <th scope="col">nom</th>
            <th scope="col">identifiant</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="station : ${stations}">
            <td th:text="${station.id}"></td>
            <td th:text="${station.nom}"></td>
            <td th:text="${station.identifiant}"></td>
            <td>
                 <form th:action="@{/stations/{id}(id=${station.id})}" style="display:inline;">
                    <button class="btn btn-info btn-sm">Modifiez</button>
                </form>

               <form th:action="@{/stations/{id}(id=${station.id})}" th:method="DELETE" style="display:inline;">
                    <button class="btn btn-warning btn-sm">Supprimez</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(stations)}">
            <td colspan="8" class="text-center text-muted">Aucune station à afficher.</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/stations/nouvelle}">
        <button class="btn btn-primary">Ajoutez</button>
    </form>
    <form th:method="post" th:action="@{/stations/importer}" method="post" enctype="multipart/form-data">
        <input type="file" name="fichier" accept=".json,application/json"
               class="form-control w-50 mb-3" onchange="this.form.submit()" required>
        <button type="submit" class="btn btn-primary">Importer</button>
    </form>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

</div>
</body>
</html>
