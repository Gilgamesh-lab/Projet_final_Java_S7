<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* À inclure dans le head de chaque page : th:replace="~{fragments/entete :: ressources}" */-->
<th:block th:fragment="ressources">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</th:block>

<!--/* Bandeau commun à inclure en haut de chaque page : th:replace="~{fragments/entete :: entete}" */-->
<nav th:fragment="entete" class="bandeau" aria-label="Navigation principale">
    <a class="marque" th:href="@{/}">
        <svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true">
            <path d="M0 10h30" stroke="#f5b700" stroke-width="4"/>
            <circle cx="15" cy="10" r="7" fill="#101e2c" stroke="#fff" stroke-width="4"/>
        </svg>
        Supervision
    </a>
    <ul class="nav-reseau">
        <!--/* Lien masqué pour l'agent ; la route reste de toute façon protégée côté serveur */-->
        <li th:if="${session.utilisateur?.responsable}"><a th:href="@{/incidents/tableau-de-bord}">Tableau de bord</a></li>
        <li th:if="${session.utilisateur?.responsable}"><a th:href="@{/statistiques}">Statistiques</a></li>
        <li><a th:href="@{/equipements}">Équipements</a></li>
        <li><a th:href="@{/incidents/declarer}">Déclarer un incident</a></li>
        <li><a th:href="@{/incidents/historique}">Historique</a></li>
        <li><a th:href="@{/stations}">Stations</a></li>
    </ul>
    <div class="utilisateur">
        Bonjour <span th:text="${session.utilisateur?.prenom}">Camille</span>
        (<span th:text="${session.utilisateur?.profil?.libelle}">Responsable d'exploitation</span>)
        | <a th:href="@{/logout}">Déconnectez-vous</a>
    </div>
    <script>
        document.querySelectorAll('.nav-reseau a').forEach(function (lien) {
            var chemin = lien.getAttribute('href').split(';')[0];
            if (location.pathname === chemin || location.pathname.indexOf(chemin + '/') === 0) {
                lien.classList.add('active');
            }
        });
    </script>
</nav>

</body>
</html>
