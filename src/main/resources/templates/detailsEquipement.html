<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fiche équipement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Ascenseur quai A</h1>
        <!--/* F4 : déclarer un incident sur cet équipement */-->
        <a href="#" class="btn btn-danger">Déclarer un incident</a>
    </div>

    <!--/* F3 : informations de l'équipement */-->
    <div class="card mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Id</dt>
                <dd class="col-sm-9">[[${equipement.id}]]</dd>
                <dt class="col-sm-3">Référence</dt>
                <dd class="col-sm-9">[[${equipement.reference}]]</dd>
                <dt class="col-sm-3">Libelle</dt>
                <dd class="col-sm-9">[[${equipement.libelle}]]</dd>
                <dt class="col-sm-3">Type</dt>
                <dd class="col-sm-9">[[${equipement.type}]]</dd>
                <dt class="col-sm-3">Station</dt>
                <dd class="col-sm-9">[[${equipement.station.nom}]]</dd>
                <dt class="col-sm-3">État</dt>
                <dd class="col-sm-9"><span class="badge bg-danger">[[${equipement.etat}]]</span></dd>
            </dl>
        </div>
    </div>

    <!--/* F3 : incidents en cours et passés, triés par date d'ouverture (RG7) */-->
    <h2 class="h5">Incidents</h2>
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Ouverture</th>
            <th>Description</th>
            <th>Statut</th>
            <th>Prestataire</th>
            <th>Résolution</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="incident: ${incidents}">
            <td th:text="${incident.id}" />
            <td th:text="${incident.dateOuverture}" />
            <td th:text="${incident.statut}" />
            <td th:text="${incident.prestataire?.nom}" />
            <td th:text="${incident.dateResolution}" />
            <td>
                <form th:action="@{/incidents/{id}(id=${incident.id})}"  th:method="GET" style="display:inline;">
                    <button class="btn btn-info btn-sm">Détails</button>
                </form>

                <form th:action="@{/incidents/{id}(id=${incident.id})}" th:method="DELETE" style="display:inline;">
                    <button class="btn btn-warning btn-sm">Supprimez</button>
                </form>
            </td>
            <br>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
