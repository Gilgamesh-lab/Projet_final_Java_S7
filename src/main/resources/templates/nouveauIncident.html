<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Déclarer un incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<div class="container" style="max-width: 700px;">
    <h1 class="h3 mb-4">Déclarer un incident</h1>

    <!--/* F4 : l'incident démarre sans prestataire, la date d'ouverture est fixée par le serveur (RG1) */-->
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Équipement</label>
            <input type="text" class="form-control" value="ASC-001 — Ascenseur quai A (Gare Centrale)" readonly>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description de la panne</label>
            <textarea id="description" name="description" rows="4" class="form-control is-invalid"></textarea>
            <!--/* Message affiché quand la validation échoue */-->
            <div class="invalid-feedback">La description est obligatoire.</div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Déclarer</button>
            <a href="#" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</div>

</body>
</html>
