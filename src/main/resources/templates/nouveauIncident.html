<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signalement d'un nouveau incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Ajout d'un nouveau incident</h1>

    <!--/* 5.11 -- Formulaire d'ajout. Le contrôleur (preparerAjoutProgrammeur) dépose un Programmeur VIDE dans le Model sous le nom "nouveauProgrammeur" :
           th:object le rattache au formulaire, th:field="*{...}" lie chaque champ à un attribut (les champs sont vides car les attributs sont null).
           Ici un POST suffit (création) : pas besoin de _method. À la validation, le contrôleur reçoit les champs via @ModelAttribute,
           enregistre le programmeur, puis redirige vers la liste actualisée (5.11.2). */-->
    <form th:action="@{/incidents/nouveau}" th:object="${nouveauIncident}" method="POST">

        <label class="form-label" for="identifiant">Identifiant</label>
        <input type="text" th:field="*{identifiant}" class="form-control mb-3 w-50">

        <label class="form-label" for="equipement">Equipement</label>
        <select th:field="*{equipement}" class="form-select mb-3 w-50">
            <option value="">-- Choisir --</option>
            <option th:each="equipement : ${equipements}"
                    th:value="${equipement.id}"
                    th:text="${equipement.libelle}">
            </option>
        </select>



        <label class="form-label" for="description">Description</label>
        <input type="text" th:field="*{description}" class="form-control mb-3 w-50">

        <label class="form-label" for="statut">Statut</label>
        <select th:field="*{statut}" class="form-select mb-3 w-50">
            <option value="">-- Choisir --</option>
            <option th:each="statut : ${statuts}"
                    th:value="${statut}"
                    th:text="${statut.libelle}">
            </option>
        </select>

        <button type="submit" class="btn btn-primary">Enregistrez</button>
    </form>

    <hr>
    <a th:href="@{/incidents}">Afficher la liste des incidents</a>
</div>
</body>
</html>
