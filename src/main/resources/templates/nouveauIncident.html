<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déclarer un incident</title>
    <th:block th:replace="~{fragments/entete :: ressources}"></th:block>
</head>
<body>

<div th:replace="~{fragments/entete :: entete}"></div>

<main class="container-xl contenu">
    <header class="entete-page">
        <div>
            <span class="surtitre">Signalement</span>
            <h1>Déclarer un incident</h1>
            <p>Décrivez la panne constatée sur un équipement.</p>
        </div>
    </header>

    <div class="panneau formulaire">
        <div th:if="${not #strings.isEmpty(erreur)}" class="alert alert-danger" role="alert" th:text="${erreur}"></div>

        <form th:action="@{/incidents/nouveau}" th:object="${nouveauIncident}" method="POST">
            <div class="mb-3">
                <label class="form-label" for="identifiant">Identifiant</label>
                <input type="text" th:field="*{identifiant}" class="form-control" placeholder="INC-011" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="equipement">Équipement</label>
                <select th:field="*{equipement}" class="form-select" required>
                    <option value="">Choisir un équipement</option>
                    <option th:each="equipement : ${equipements}"
                            th:value="${equipement.id}"
                            th:text="${equipement.libelle + ' · ' + equipement.station.nom}"></option>
                </select>
            </div>

            <div>
                <label class="form-label" for="description">Description</label>
                <textarea th:field="*{description}" rows="4" class="form-control" required></textarea>
            </div>

            <div class="pied-formulaire">
                <button type="submit" class="btn btn-signal">Déclarer l'incident</button>
                <a th:href="@{/equipements}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
